name: Build

# Every push and pull request builds the mod and uploads dist/ as an
# artifact. Pushing a version tag (v1.0.0, v1.2.3, ...) also attaches
# WreckingBall-<tag>.zip to the release with that name (a new draft if
# there isn't one yet), unless a zip is already attached. The zip holds
# mods/wreckingball/ (mod.json, WreckingBall.dll, README.txt, LICENSE.txt),
# so it extracts straight into the Azimuth folder and the FH2ML Manager's
# Install mod takes it as it is.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW_VERSION: "20260922"
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install llvm-mingw + ninja
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
          curl -fsSL "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64.tar.xz" -o llvm-mingw.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xJf llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1

      - name: Build into dist/
        env:
          CMAKE_GENERATOR: Ninja
        run: ./scripts/build.sh

      - name: Name the build
        id: name
        run: |
          # The version in CMakeLists.txt is what the mod reports (and what its
          # mod.json says) and what FH2ML compares against GitHub; a release tag
          # has to match it.
          version=$(sed -n 's/^project([^ ]* VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "CMakeLists.txt version: $version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#[vV]}"
            if [[ "$tag" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION $version in CMakeLists.txt; bump it first."
              exit 1
            fi
            echo "name=WreckingBall-${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=WreckingBall-v${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist

      - name: Zip
        run: cd dist && zip -r -9 "../${{ needs.build.outputs.name }}.zip" .

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ needs.build.outputs.name }}.zip
          TITLE: "WreckingBall"
        run: |
          set -uo pipefail
          fail() { echo "::error::$1: $(tr '\n' ' ' < err.txt)"; exit 1; }
          # A release made from the Releases page already exists by the time
          # its tag triggers this. If it already has a zip (uploaded by hand),
          # leave it alone; otherwise add ours. With no release yet, make a
          # draft one.
          # Look the release up through the list too: a release that was a
          # draft until a moment ago isn't always found by tag straight away.
          find_release() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" 2>err.txt |
              jq -ce --arg t "$GITHUB_REF_NAME" '[.[] | select(.tag_name == $t)][0] // empty'
          }
          rel=$(find_release) || { sleep 15; rel=$(find_release); } || rel=""
          if [ -n "$rel" ]; then
            if jq -e '[.assets[].name | endswith(".zip")] | any' <<<"$rel" >/dev/null; then
              echo "::notice::$GITHUB_REF_NAME already has a zip attached; not adding another."
              exit 0
            fi
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" 2>err.txt || fail "upload failed"
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" \
              --draft --title "$TITLE $GITHUB_REF_NAME" --generate-notes 2>err.txt || fail "release create failed"
          fi
